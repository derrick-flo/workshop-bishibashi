# 내 컴퓨터에서 Docker 로 띄워 보기:
#   docker compose up --build             → http://localhost:8787 (진행자 화면 /host)
#   HOST_KEY=... docker compose up --build → 진행자 키를 넣어 띄우기
# 진행 상태는 bishibashi-data 볼륨의 room.json 에 남아서 다시 켜도 이어진다.
# 내 컴퓨터·사내망 주소로 열면 진행자 키 없이 진행자 화면이 열리므로 포트는 이 컴퓨터(127.0.0.1)에만 연다.
# 같은 Wi-Fi 의 폰으로 시험하려면 "8787:8787" 로 바꾼다.
services:
  bishibashi:
    build: .
    image: workshop-bishibashi:local
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST_KEY: ${HOST_KEY:-}
    volumes:
      - bishibashi-data:/app/data

volumes:
  bishibashi-data:
